[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --tb=short --strict-markers
markers =
    smoke: Quick sanity smoke tests for critical user journeys
    regression: Full regression test suite
    api: Backend REST API contract and status tests
    e2e: End-to-end browser automation workflows
